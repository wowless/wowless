name: build
type:
  record:
    build:
      required: true
      type: string
    date:
      required: true
      type: string
    family:
      required: true
      type:
        taggedunion:
          Classic: tag
          Mainline: tag
    gametype:
      required: true
      type:
        ref:
          schema: gametypes
    hash:
      required: true
      type: string
    test:
      required: true
      type: boolean
    tocversion:
      required: true
      type: number
    version:
      required: true
      type: string
